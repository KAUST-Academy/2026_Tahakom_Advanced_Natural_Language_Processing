# =============================================================================
# Advanced Natural Language Processing — course content
# Phase 2B of the Tahakom AI Early Careers Program (the NLP track).
#
# This file is the single source of truth for the website. Edit it, run
# `python3 build.py --check`, and every page is regenerated. Never edit the
# generated HTML in _site/ — it is deleted and rebuilt every time.
#
# Resource `status`:
#   todo   -> renders greyed out as "Coming soon", not linked, not checked.
#   ready  -> renders as a button; `file` must exist or --check fails the build.
#
# Material comes from Tahakom_Early_Careers/Phase_2B_Advanced_Natural_Language_Processing,
# day for day and with the same file names: its Day_NN_<Title>/Lectures/ is
# Slides/Day_N/ here, its Labs/ is Labs/Day_N/, and its Optional/ material is in
# an Optional/ subfolder of each. README.md has the details.
# =============================================================================

[course]
title      = "Advanced Natural Language Processing"
title_lead = "Advanced"
title_rest = "Natural Language Processing"

tagline  = "Phase 2B of the Tahakom AI Early Careers Program, at Oxford from 12 to 23 October 2026: ten days from the transformer to large language models, how they are adapted and aligned, and how they are run in production."
client   = "Tahakom"
provider = "KAUST Academy"
year     = "2026"

starts   = "2026-10-12"
ends     = "2026-10-23"
location = "Oxford"

# Drives the footer licence link and the Colab URL pattern below.
repo         = "KAUST-Academy/2026_Tahakom_Advanced_Natural_Language_Processing"

license      = "GPL-3.0"
license_note = "Recording and uploading lectures online is not permitted."

summary = """
The natural language processing track of the AI Early Careers Program. It starts
with attention and the transformer, builds up to large language models,
tokenization and mixture of experts, then adapts them with fine-tuning,
prompting, retrieval and reasoning, connects them to images and tools, and aligns
them with reinforcement learning. The second week turns to how modern models are
built and run: the transformer since 2017, inference optimization and long
context, distributed training, and evaluation and security.
"""

# -----------------------------------------------------------------------------
# Weeks
#
# Two UK teaching weeks, Monday to Friday. Each [[weeks]] block becomes a
# dropdown in the nav and a section on the home page; a day joins a week with
# `week = N` (1-based, in the order below). Delete every [[weeks]] block to get
# the template's flat nav and single schedule back.
# -----------------------------------------------------------------------------

[[weeks]]
label = "Week 1"
title = "Transformers, Language Models and Agents"
blurb = "Monday 12 to Friday 16 October. Attention and the transformer, large language models, tokenization and mixture of experts, fine-tuning and PEFT, prompting, retrieval and reasoning models, then multimodal models and agents."

[[weeks]]
label = "Week 2"
title = "Alignment, Modern Architectures and Production"
blurb = "Monday 19 to Friday 23 October. RL post-training with GRPO and GSPO, the transformer from 2017 to 2026, inference optimization and long context, distributed training and serving, then evaluation, security and enterprise NLP."

# -----------------------------------------------------------------------------
# Days
#
# Each day is 6 hours of contact time: two lecture blocks and two lab blocks.
# Rows marked "Optional" are extension material, not taught in the 6 hours.
# `date` is a TOML date (no quotes); it is shown on the day's card and page.
#
# Colab URLs: https://colab.research.google.com/github/<repo>/blob/main/<path>
# with the path percent-encoded (`&` is %26, `(` and `)` are %28 and %29).
# -----------------------------------------------------------------------------

